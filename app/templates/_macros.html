{% macro status_form(domain, current, nxt) %}
<form method="post" action="{{ url_for('tracker_set') }}" class="inline seg">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="domain" value="{{ domain }}">
  <input type="hidden" name="next" value="{{ nxt }}">
  <button name="status" value="todo" class="{{ 'on' if current == 'todo' }}">To do</button>
  <button name="status" value="submitted" class="{{ 'on' if current == 'submitted' }}">Submitted</button>
  <button name="status" value="removed" class="{{ 'on ok' if current == 'removed' }}">Removed</button>
</form>
{% endmacro %}

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Privacy Scanner{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
{% if user %}<nav>
  <a class="brand" href="{{ url_for('dashboard') }}">Privacy Scanner</a>
  <a href="{{ url_for('tracker') }}">Opt-out tracker</a>
  {% if user['is_admin'] %}<a href="{{ url_for('admin') }}">Users</a>{% endif %}
  <span class="sp"></span>
  <a href="{{ url_for('account') }}">{{ user['username'] }}</a>
  <form method="post" action="{{ url_for('logout') }}" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Sign out</button></form>
</nav>{% endif %}
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
